- title: Selected Projects
  type: time_table
  contents:
    - title: Hand Bone Image Segmentation
      institution: Naver BoostCamp AI Tech 7th (Computer Vision Track)
      year: 2024.11
      description:
        - "Semantic segmentation of 29 hand-bone classes from X-ray images with multi-channel probability maps and RLE submission."
        - "Improved performance via auxiliary-classifier loss, metric-aligned loss search, pseudo-labeling, pixel shuffle/unshuffle for interpolation loss recovery, and a 1x1 conv layer for overlapping bones."
    - title: Multilingual Receipt OCR
      institution: Naver BoostCamp AI Tech 7th (Computer Vision Track)
      year: 2024.10
      description:
        - "Data-centric text-detection on multilingual (Chinese, Japanese, Thai, Vietnamese) receipt images; output as UFO-format bounding boxes (model fixed, data only)."
        - "Applied salt-and-pepper noise, binarization (incl. adaptive threshold), and normalization to build a more robust pipeline."
    - title: Object Detection for Recyclable Waste Classification
      institution: Naver BoostCamp AI Tech 7th (Computer Vision Track)
      year: 2024.10
      description:
        - "Detection of 10 waste categories (COCO format), evaluated by mAP50; focused on improving low mAP for small bounding boxes."
        - "Explored Swin Transformer backbone, higher input resolution, small-bbox-specialized model ensembling, and a custom SizeWeightedLoss."
    - title: Sketch Image Classification
      institution: Naver BoostCamp AI Tech 7th (Computer Vision Track)
      year: 2024.09
      description:
        - "500-class sketch classification over 25,035 images."
        - "Hierarchical classification: extracted features from early/middle stages of Swin-Base for coarse/mid-level losses, weighted-summed with the fine-grained loss for backpropagation."
    - title: Deep Learning & Map API-based Dining Nutrition Information Service
      institution: Kyung Hee University Data Analysis Capstone Design (Team Lead)
      year: 2021.08
      description:
        - "Led the team and technical decisions; awarded Grand Prize."
        - "Built a YOLOv5 food-detection model (data collected via Naver Search API, labeled with labelme) and matched detections to a standard food-nutrition database for personalized intake tracking."
    - title: A Data-Driven Approach to a Struggling Dessert Cafe
      institution: Personal / Academic Project
      year: 2020.06
      description:
        - "Designed and validated a decision-tree (C5.0) classifier for dessert-purchase prediction; combined with logistic regression, multiple linear regression (backward elimination), and association rules to derive sales strategy."
    - title: A Data-Driven Game of Reading the Crowd at Amusement Parks
      institution: Personal / Academic Project
      year: 2020.01
      description:
        - "Predicted daily visitor counts from 9 factors (day, weather, season, discomfort index, etc.) using crawled open data."
        - "Modeled with RandomForestRegressor, PolynomialFeatures, and LinearRegression (scikit-learn)."

